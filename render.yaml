services:
  - type: web
    name: contextguard
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python wsgi.py
    envVars:
      - key: PORT
        value: "10000"
      - key: DATABASE_TYPE
        value: duckdb
      - key: LLM_PROVIDER
        value: mock
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: SANDBOX_TIMEOUT
        value: "5.0"
      - key: PIPELINE_TIMEOUT
        value: "60.0"
      # Optional: Set these in the Render dashboard for real AI reviews
      # - key: GEMINI_API_KEY
      #   sync: false
      # - key: GITHUB_TOKEN
      #   sync: false
    healthCheckPath: /health
